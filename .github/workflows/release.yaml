---

name: Publish release

# ---------------
# Control secrets
# ---------------
#
# At the GitHub 'organisation' or 'project' level you are expected to
# have the following GitHub 'Repository Secrets' defined
# (i.e. via 'Settings -> Secrets'): -
#
# DOCKERHUB_USERNAME      required
# DOCKERHUB_TOKEN         required
#
# Unlike the 'latest' workflow the credentials are not optional here,
# a release that fails to publish its image should fail loudly.
#
# -----------
# Environment (GitHub Environments)
# -----------
#
# pypi      The package is published to PyPI using 'Trusted Publishing'
#           (no secrets). PyPI must have a trusted publisher configured
#           for this repository, this workflow (release.yaml)
#           and this environment (pypi).

on:
  push:
    # Semantic version tags (with no 'v' prefix), i.e. '1.0.0' or '1.0.0-rc.1'.
    # The image and PyPI package are published using the same version.
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
    - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  image:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out the repo
      uses: actions/checkout@v5
    - name: Set lower case owner name
      run: |
        echo "OWNER_LC=${OWNER,,}" >>"${GITHUB_ENV}"
      env:
        OWNER: '${{ github.repository_owner }}'
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Docker build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: ${{ env.OWNER_LC }}/knitwork:${{ github.ref_name }}
        push: true

  build:
    name: Test and build Python package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out the repo
      uses: actions/checkout@v5
      with:
        # The package version is derived from git tags
        fetch-depth: 0
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        # Never build a release from a (potentially poisoned) cache
        enable-cache: false
    - name: Run tests
      run: uv run --only-group dev pytest
    - name: Build package
      run: uv build
    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  pypi:
    name: Publish Python package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing
      id-token: write
    steps:
    - name: Download package
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
