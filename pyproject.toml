[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "Knitwork"
dynamic = ["version"]
authors = [
    { name = "Max Winokan", email = "max@winokan.com" },
]
description = "FragmentKnitwork"
readme = "README.md"
requires-python = ">=3.10"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "joblib",
    "mrich",
    "neo4j",
    "numpy",
    "pandas",
    "rdkit",
    "rich",
    "scipy",
    "typer",
]

[project.urls]
"Homepage" = "https://github.com/xchem/Knitwork"
"Bug Tracker" = "https://github.com/xchem/Knitwork/issues"

[dependency-groups]
dev = [
    "build",
    "packaging",
    "pytest",
]

# The package version comes from the repository's git tag (e.g. '1.2.0').
# Builds without git history (e.g. the Docker image) fall back to '0.0.0'.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["knitwork"]

[tool.hatch.build.targets.sdist]
exclude = [
    "2112-investigation",
    "data",
]
