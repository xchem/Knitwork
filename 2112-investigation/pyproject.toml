[project]
name = "cypher-query-tester"
version = "1.0.0"
description = "Times the neo4j cypher query described by cypher.map against the SMILES/synthon pairs in README.md"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j",
]

[project.scripts]
cypher-query-tester = "cypher_query:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/cypher_query.py"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
